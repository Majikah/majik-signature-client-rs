name: Prepare large-file streaming sources

on:
  push:
    branches:
      - feat/path-backed-streaming-signing

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/path-backed-streaming-signing
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Restore source payload
        run: |
          set -euo pipefail
          cat .github/streaming-payload/part-*.b64 | base64 --decode > /tmp/streaming-pr-payload.tar.gz
          tar -tzf /tmp/streaming-pr-payload.tar.gz
          tar -xzf /tmp/streaming-pr-payload.tar.gz -C .
      - name: Format Rust sources and remove staging files
        run: |
          set -euo pipefail
          cargo fmt --all
          rm -rf .github/streaming-payload
          rm -f .github/workflows/prepare-streaming.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add bounded-memory large-file streaming"
          git push origin HEAD:feat/path-backed-streaming-signing
